name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe des modules
        run: for f in public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Tests (calendrier liturgique, fichiers de lectures)
        run: node --test tests/*.test.mjs

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Tests des règles Firestore (émulateur)
        run: npx firebase emulators:exec --project demo-guardian --only firestore "node --test tests/rules.spec.mjs"
