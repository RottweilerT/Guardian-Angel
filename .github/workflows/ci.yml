name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntaxe des modules
        run: for f in public/js/*.js public/js/views/*.js public/sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Tests (calendriers, registre des droits, données)
        run: node --test tests/*.test.mjs
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Règles Firestore (émulateur)
        run: npx firebase emulators:exec --project demo-guardian --only firestore "node --test tests/rules.spec.mjs"
