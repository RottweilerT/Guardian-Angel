name: Notifications push
# Serveur d'envoi des notifications (server/notify.mjs) : détecte les nouvelles publications,
# envoie les notifications en attente via FCM HTTP v1 et nettoie les abonnements invalides.
# GitHub Actions remplace ici Cloud Functions (qui exigeraient le forfait Blaze) ; le délai réel varie de 5 à 20 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "37 3 * * 1"
  workflow_dispatch:
concurrency: { group: notify, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Traiter et envoyer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node server/notify.mjs
  keepalive:
    # GitHub suspend les tâches planifiées après 60 jours sans activité sur le dépôt.
    runs-on: ubuntu-latest
    if: github.event.schedule == '37 3 * * 1'
    permissions: { actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with: { use_api: true }
