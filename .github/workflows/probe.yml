name: probe
on: { push: { branches: [probe-fcm] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=""
          for v in 13.1.0 12.11.0 12.4.0 10.12.2; do
            curl -s -o m.js https://www.gstatic.com/firebasejs/$v/firebase-messaging.js
            E=$(grep -oE "export ?\{[^}]*\}" m.js | tail -1 | tr -d ' ' | cut -c1-400)
            curl -s -o f.js https://www.gstatic.com/firebasejs/$v/firebase-firestore.js
            F=$(grep -c "persistentMultipleTabManager" f.js)
            R="$R | $v msg=[$E] fsTab=$F"
          done
          echo "::notice::$R"
          mkdir t && cd t && npm init -y >/dev/null && npm i firebase-admin@13 >/dev/null 2>&1
          V=$(node -p "require('firebase-admin/package.json').version")
          FID=$(grep -l "fid" node_modules/firebase-admin/lib/messaging/*.js | xargs -n1 basename | tr '\n' ',')
          L=$(npm view firebase-admin version)
          echo "::notice::admin13=$V fidfiles=$FID latest=$L"
