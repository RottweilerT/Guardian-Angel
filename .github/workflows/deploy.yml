name: Déploiement Firebase
on:
  push:
    branches: [main]
    paths: ["public/**", "scripts/fetch-churches.mjs", "scripts/check-firebase-sdk.mjs", "firebase.json", "firestore.rules", "firestore.indexes.json", ".github/workflows/deploy.yml"]
  schedule:
    - cron: "23 3 * * 1"   # chaque lundi : rafraîchit les données OpenStreetMap
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Bibliothèque de carte (copie locale, aucun CDN tiers)
        run: |
          npm install --no-save --no-audit --no-fund leaflet@1.9.4
          mkdir -p public/vendor/leaflet
          cp -r node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/dist/images node_modules/leaflet/LICENSE public/vendor/leaflet/
      - name: Données des églises (OpenStreetMap, ODbL)
        run: node scripts/fetch-churches.mjs
      - name: SDK Firebase disponible sur le CDN (exports requis)
        run: node scripts/check-firebase-sdk.mjs
      - name: Configuration publique des notifications (clé VAPID publique, App Check)
        env: { VAPID: "${{ vars.FCM_VAPID_KEY }}", APPCHECK: "${{ vars.APPCHECK_SITE_KEY }}" }
        run: |
          node -e 'const v=process.env.VAPID||"",a=process.env.APPCHECK||"";if(v&&!/^[A-Za-z0-9_-]{80,100}$/.test(v)){console.log("::error::FCM_VAPID_KEY invalide");process.exit(1)};require("fs").writeFileSync("public/js/push-config.js","// Généré au déploiement — valeurs publiques.\nexport const pushConfig = "+JSON.stringify({vapidKey:v,appCheckSiteKey:a},null,2)+";\n");console.log(v?"::notice::Notifications : clé VAPID configurée":"::warning::Notifications : variable FCM_VAPID_KEY absente, abonnement désactivé sur le site")'
      - name: Clé du compte de service
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Déployer l'hébergement et les règles Firestore
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
      - name: Vérifier le site en ligne
        run: |
          sleep 5
          U="https://${{ vars.FIREBASE_PROJECT_ID }}.web.app"
          N=$(curl -fsS "$U/data/churches.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).churches.length))")
          curl -fsS "$U/js/app.js" | grep -q "Guardian Angel — point d'entrée"
          curl -fsS -o /dev/null "$U/vendor/leaflet/leaflet.js"
          curl -fsS "$U/sw.js" | grep -q "notificationclick"
          echo "::notice::Site en ligne vérifié : application v2 servie, bibliothèque de carte présente, $N églises publiées."
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: Conserver l'extraction dans le dépôt
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- public/js/push-config.js
          git add public/data/churches.json
          git diff --cached --quiet || { git commit -qm "Données : extraction OpenStreetMap [skip ci]"; git push -q || echo "push ignoré"; }
